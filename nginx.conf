# ══════════════════════════════════════════════════════════════
# LittleHeart AI Care — Nginx Reverse Proxy + WAF Configuration
# Used by the nginx-waf Docker Compose service
# ══════════════════════════════════════════════════════════════

# Load OWASP ModSecurity module
load_module modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
}

http {
    # --- Security Headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss: ws:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Rate Limiting Zone ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # --- Logging ---
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri",'
        '"status":$status,"body_bytes":$body_bytes_sent,'
        '"upstream_time":"$upstream_response_time","request_time":"$request_time"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # --- Upstream ---
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Enable ModSecurity WAF
        modsecurity on;
        modsecurity_rules_file /etc/modsecurity.d/modsecurity.conf;

        # --- Client Limits ---
        client_max_body_size 5m;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # --- API Proxy ---
        location / {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $request_id;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # --- WebSocket Proxy ---
        location /ws/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # --- Health Check (bypass WAF) ---
        location = /health {
            modsecurity off;
            proxy_pass http://backend_api/health;
        }

        # --- Metrics (bypass WAF, internal only) ---
        location = /metrics {
            modsecurity off;
            allow 172.16.0.0/12;  # Docker network
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://backend_api/metrics;
        }

        # --- Block sensitive paths ---
        location ~ /\. {
            deny all;
            return 404;
        }

        location ~ ^/(\.env|\.git|__pycache__|\.pyc) {
            deny all;
            return 404;
        }
    }
}
